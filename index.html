<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./v2.css?v=0.4">
  <script src="./v2.js?v=0.4"></script>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Read</title>
</head>
<body>
  <header>
    <form id="search-form" class="shadow">
      <input type="search" name="search" placeholder="Search">
      <button type="submit">🔍</button>
    </form>
    <form id="goto-form" class="shadow">
      <input type="number" name="goto" placeholder="Go to #">
      <button type="submit">➡️</button>
    </form>
    <a href="?resource=data">🔠</a>
    <a href="?resource=numbers">🔢</a>
  </header>
  <main class="shadow">
    <!-- <button id="btn-first" class="first">First</button> -->
    <div class="current">
      <div id="phrase">
        Loading...
      </div>
      <small id="translation">Cargando...</small>
      <code id="counter">0/0</code>
    </div>
    <!-- <button id="btn-last" class="last">Last</button> -->
    <nav>
      <button id="btn-prev" class="previous">
        <div id="prev-phrase">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 0 1 .708.708L2.707 7.5H14.5A.5.5 0 0 1 15 8z"/>
          </svg>
        </div>
        <small id="prev-translation"></small>
      </button>
      <button id="btn-speak">🔊</button>
      <button id="btn-next" class="next">
        <div id="next-phrase">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
          </svg>
        </div>
        <small id="next-translation"></small>
      </button>
    </nav>
  </main>
</body>
</html>
