<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./v2.css?v=0.2">
  <script src="./v2.js?v=0.3"></script>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Read</title>
</head>
<body>
  <header>
    <form id="search-form">
      <input type="search" name="search" placeholder="Search">
      <button type="submit">🔍</button>
    </form>
  </header>
  <main>
    <button id="btn-first" class="first">First</button>
    <button id="btn-prev" class="previous">
      <div id="prev-phrase">Previos</div>
      <small id="prev-translation"></small>
    </button>
    <div class="current">
      <div id="phrase">
        Loading...
      </div>
      <button id="btn-speak">🔊</button>
      <small id="translation">Cargando...</small>
      <code id="counter">0/0</code>
    </div>
    <button id="btn-next" class="next">
      <div id="next-phrase">Next</div>
      <small id="next-translation"></small>
    </button>
    <button id="btn-last" class="last">Last</button>
  </main>
</body>
</html>
